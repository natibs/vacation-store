<app-auth-card title="Change password" subtitle="Choose a strong password you don't use elsewhere.">
  <form class="authForm" [formGroup]="form" (ngSubmit)="submit()">
    @if (formError()) {
      <nati-ui-error-message variant="banner" [message]="formError()!" />
    }

    <input
      natiUiInput
      type="password"
      formControlName="currentPassword"
      label="Current password"
      autocomplete="current-password"
      [customErrorMessages]="{ incorrect: 'Current password is incorrect.' }"
    />
    <input
      natiUiInput
      type="password"
      formControlName="newPassword"
      label="New password"
      autocomplete="new-password"
      [customErrorMessages]="{ passwordComplexity: 'Password does not meet all requirements below.' }"
    />
    @if (newPasswordDirty()) {
      <app-password-requirements [value]="newPasswordValue()" />
    }

    <input
      natiUiInput
      type="password"
      formControlName="confirmPassword"
      label="Confirm new password"
      autocomplete="new-password"
      [customErrorMessages]="{ passwordsMismatch: 'Passwords do not match.' }"
    />

    <button natiUiButton type="submit" class="authSubmit" [loading]="submitting()">
      Update password
    </button>
  </form>

  <span auth-card-footer><a routerLink="/">Cancel</a></span>
</app-auth-card>
