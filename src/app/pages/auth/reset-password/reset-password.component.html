<app-auth-card title="Set a new password">
  @if (!token) {
    <nati-ui-error-message variant="banner" message="This reset link is missing or invalid." />
    <a natiUiButton [routerLink]="['/forgot-password']" class="authSubmit">Request a new link</a>
  } @else {
    <form class="authForm" [formGroup]="form" (ngSubmit)="submit()">
      @if (formError()) {
        <nati-ui-error-message variant="banner" [message]="formError()!" />
      }

      <input
        natiUiInput
        type="password"
        formControlName="newPassword"
        label="New password"
        autocomplete="new-password"
        [customErrorMessages]="{ passwordComplexity: 'Password does not meet all requirements below.' }"
      />
      @if (newPasswordDirty()) {
        <app-password-requirements [value]="newPasswordValue()" />
      }

      <input
        natiUiInput
        type="password"
        formControlName="confirmPassword"
        label="Confirm new password"
        autocomplete="new-password"
        [customErrorMessages]="{ passwordsMismatch: 'Passwords do not match.' }"
      />

      <button natiUiButton type="submit" class="authSubmit" [loading]="submitting()">
        Reset password
      </button>
    </form>
  }

  <span auth-card-footer><a routerLink="/login">Back to log in</a></span>
</app-auth-card>
