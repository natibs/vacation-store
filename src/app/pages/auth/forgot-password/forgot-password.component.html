<app-auth-card
  title="Reset your password"
  subtitle="Enter the email on your account and we'll help you get back in."
>
  @if (resetToken()) {
    <p class="authNotice">
      We've generated password reset instructions for <strong>{{ submittedEmail() }}</strong>.
    </p>
    <p class="authNoticeMuted">This demo has no email server, so continue directly:</p>
    <a
      natiUiButton
      [routerLink]="['/reset-password']"
      [queryParams]="{ token: resetToken() }"
      class="authSubmit"
      >Continue to reset password</a
    >
  } @else {
    <form class="authForm" [formGroup]="form" (ngSubmit)="submit()">
      @if (formError()) {
        <nati-ui-error-message variant="banner" [message]="formError()!" />
      }

      <input
        natiUiInput
        type="email"
        formControlName="email"
        label="Email"
        placeholder="you@example.com"
        autocomplete="email"
      />

      <button natiUiButton type="submit" class="authSubmit" [loading]="submitting()">
        Send reset instructions
      </button>
    </form>
  }

  <span auth-card-footer><a routerLink="/login">Back to log in</a></span>
</app-auth-card>
