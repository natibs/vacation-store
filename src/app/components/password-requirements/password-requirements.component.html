<ul class="passwordRules">
  @for (rule of rules; track rule.key) {
    <li class="passwordRule" [class.passwordRuleValid]="isValid(rule)">
      <span class="passwordRuleIconStack" aria-hidden="true">
        <svg lucideX class="passwordRuleIcon passwordRuleIconInvalid" [size]="15"></svg>
        <svg lucideCheck class="passwordRuleIcon passwordRuleIconValid" [size]="15"></svg>
      </span>
      <span>{{ rule.label }}</span>
    </li>
  }
</ul>
