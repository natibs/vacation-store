<div class="natiUiField guestStepper">
  <span class="natiUiFieldLabel">{{ label() }}</span>
  <div class="guestStepperControl">
    <button
      type="button"
      class="guestStepperBtn"
      [disabled]="value() <= min()"
      (click)="decrement()"
      aria-label="Decrease guests"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    </button>
    <span class="guestStepperValue">{{ value() }} {{ value() === 1 ? 'guest' : 'guests' }}</span>
    <button
      type="button"
      class="guestStepperBtn"
      [disabled]="value() >= max()"
      (click)="increment()"
      aria-label="Increase guests"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M8 3.5v9M3.5 8h9"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>
</div>
