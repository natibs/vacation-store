<button
  type="button"
  class="themeToggle"
  (click)="themeService.toggle()"
  [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
>
  @if (themeService.theme() === 'dark') {
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <circle cx="10" cy="10" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
      <path
        d="M10 2v2M10 16v2M18 10h-2M4 10H2M15.5 4.5l-1.4 1.4M5.9 14.1l-1.4 1.4M15.5 15.5l-1.4-1.4M5.9 5.9 4.5 4.5"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
      />
    </svg>
  } @else {
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <path d="M17 12.5A7 7 0 1 1 7.5 3a5.5 5.5 0 0 0 9.5 9.5Z" fill="currentColor" />
    </svg>
  }
</button>

<router-outlet />
<nati-ui-toast />
